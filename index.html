<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M&A Inversiones">
<meta name="theme-color" content="#d4a847">
<title>M&A Inversiones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--bg2:#0d0d16;--bg3:#111118;--bg4:#14141e;
  --br:#1e1e2e;--br2:#2a2a3e;
  --go:#d4a847;--go2:#7a5c0e;
  --tx:#e8e0d0;--tx2:#a09880;--tx3:#888;--tx4:#555;
  --bl:#3b82f6;--gn:#10b981;--am:#f59e0b;--rd:#ef4444;--pu:#8b5cf6;
  --fs:15px;--fs-sm:13px;--fs-xs:11px;--fs-lg:17px;
}
body{background:var(--bg);color:var(--tx);font-family:'Courier Prime',monospace;min-height:100vh;font-size:var(--fs)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--go2)}

/* NAV DESKTOP */
#nav{background:var(--bg2);border-bottom:1px solid var(--br);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;min-height:56px}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:3px;color:var(--go);padding:12px 0 2px}
.sub{font-size:10px;letter-spacing:4px;color:var(--tx4);padding-bottom:10px}
.navlinks{display:flex;flex-wrap:wrap}
.nb{background:none;border:none;cursor:pointer;padding:10px 14px;font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.nb:hover{color:var(--go)}.nb.on{color:var(--go);border-bottom-color:var(--go)}

/* HAMBURGER */
.hamburger{display:none;background:none;border:1px solid var(--br2);color:var(--tx);padding:8px 12px;cursor:pointer;font-size:20px}
.mobile-menu{display:none;position:fixed;top:56px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--br);z-index:49;flex-direction:column;padding:8px 0}
.mobile-menu.open{display:flex}
.mobile-menu .nb{padding:14px 24px;border-bottom:1px solid var(--bg3);font-size:14px;text-align:left;border-left:3px solid transparent}
.mobile-menu .nb.on{border-left-color:var(--go);background:var(--bg3)}

/* LAYOUT */
#app{max-width:1320px;margin:0 auto;padding:24px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:10px;flex-wrap:wrap}
.pt{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;color:#c8bfa8}
.ps{font-size:11px;letter-spacing:2px;color:var(--tx4);margin-top:3px;text-transform:uppercase}

/* CARDS */
.card{background:var(--bg3);border:1px solid var(--br);padding:20px}
.csm{background:var(--bg3);border:1px solid var(--br);padding:16px}

/* BUTTONS */
.btn{cursor:pointer;font-family:inherit;letter-spacing:1px;text-transform:uppercase;font-size:12px;border:none;padding:10px 20px;transition:.15s;border-radius:2px}
.bg{background:linear-gradient(135deg,var(--go2),var(--go));color:#000;font-weight:700}.bg:hover{opacity:.85}
.bo{background:none;border:1px solid var(--br2);color:var(--tx3)}.bo:hover{border-color:var(--go);color:var(--go)}
.bd{background:none;border:1px solid #4a1a1a;color:var(--rd)}.bd:hover{background:#1a0808}
.bs{background:none;border:1px solid #1a4a2a;color:var(--gn)}.bs:hover{background:#081a0e}
.bsm{padding:7px 14px;font-size:11px}.bxs{padding:4px 10px;font-size:10px}

/* FORMS */
.fg{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.lb{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--tx4);margin-bottom:5px}
input,select,textarea{background:var(--bg);border:1px solid var(--br);color:var(--tx);padding:10px 13px;font-family:inherit;font-size:14px;width:100%;outline:none;transition:.2s;border-radius:2px}
input:focus,select:focus,textarea:focus{border-color:var(--go)}
input::placeholder,textarea::placeholder{color:var(--tx4)}
select option{background:var(--bg2)}
textarea{resize:vertical;min-height:56px}

/* TABLES */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--tx4);padding:10px 13px;text-align:left;border-bottom:1px solid var(--br);background:var(--bg2);white-space:nowrap}
.tbl td{padding:12px 13px;border-bottom:1px solid var(--bg2);font-size:14px}
.tbl tr:hover td{background:var(--bg4)}.tbl tr.ck{cursor:pointer}

/* BADGES */
.bdg{display:inline-block;padding:3px 8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-radius:2px}

/* MODALS */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--br2);padding:28px;width:100%;max-width:760px;margin-top:8px}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mtt{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:#c8bfa8}
.mft{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}

/* STATS */
.sv{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;color:var(--go);line-height:1}
.sl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--tx4);margin-top:4px}
.stl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--tx4);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--br)}

/* LAYOUT UTILS */
.grid{display:grid;gap:14px}
.fb{display:flex;justify-content:space-between;align-items:center}
.fx{display:flex}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.tg{color:var(--go)}.tgr{color:var(--gn)}.tr{color:var(--rd)}.ta{color:var(--am)}.wf{width:100%}
.serif{font-family:'Cormorant Garamond',serif}
.srch{position:relative;margin-bottom:16px}
.srch span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx4);pointer-events:none;font-size:16px}
.srch input{padding-left:36px}
.pb{height:5px;background:var(--br);border-radius:2px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--go2),var(--go));transition:.4s}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;font-size:13px;letter-spacing:1px;z-index:500;opacity:0;transition:.3s;pointer-events:none;border-radius:2px}
#toast.on{opacity:1}

/* ALERTS */
.al{padding:12px 16px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:10px;border-radius:2px}
.al-r{background:#1a0808;border:1px solid #4a1a1a;color:var(--rd)}
.al-a{background:#110d00;border:1px solid #3a2800;color:var(--am)}
.al-g{background:#081a0e;border:1px solid #1a4a2a;color:var(--gn)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--br);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:none;border:none;padding:10px 18px;font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--tx4);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--go)}.tab.on{color:var(--go);border-bottom-color:var(--go)}

/* CLIENT/CAJA CARDS */
.cc{background:var(--bg3);border:1px solid var(--br);padding:18px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;border-radius:2px}
.cc:hover{border-color:var(--br2);transform:translateY(-2px)}
.cc .ac{position:absolute;top:0;left:0;width:3px;height:100%}

/* CHIP STATUS */
.chip-c{background:#0a1a2e;border:1px solid #1a3a5e;color:var(--bl)}
.chip-ok{background:#081a0e;border:1px solid #1a4a2a;color:var(--gn)}
.chip-v{background:#1a0808;border:1px solid #4a1a1a;color:var(--rd)}

/* PREVIEW BOX */
.pvbox{background:var(--bg4);border:1px solid var(--br2);padding:14px;margin-top:12px;border-radius:2px}
.pvr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--br);font-size:14px;align-items:center}
.pvr:last-child{border:none;padding-top:8px;font-weight:700;font-size:15px}
.pvr .lk{color:var(--tx3);font-size:12px}

/* FOTO */
.fz{border:1px dashed var(--br2);padding:20px;text-align:center;cursor:pointer;transition:.15s;color:var(--tx4);font-size:13px;border-radius:2px}
.fz:hover{border-color:var(--go);background:var(--bg4)}

/* DESTINO BADGES */
.dst-pago{background:#081a0e;border:1px solid #1a4a2a;color:var(--gn)}
.dst-efectivo{background:#0a0a1e;border:1px solid #1a1a4a;color:var(--bl)}
.dst-endoso{background:#100a1a;border:1px solid #2a1a4a;color:var(--pu)}
.dst-otro{background:#111100;border:1px solid #3a3a00;color:var(--am)}

/* SEARCH GLOBAL */
.global-search{position:relative}
.global-search input{background:var(--bg3);border:1px solid var(--br2);padding:10px 16px 10px 42px;font-size:14px;width:280px;border-radius:20px}
.global-search input:focus{border-color:var(--go);width:340px}
.global-search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx4)}
.search-results{position:absolute;top:46px;right:0;width:380px;background:var(--bg2);border:1px solid var(--br2);z-index:60;max-height:400px;overflow-y:auto;border-radius:2px}
.sr-item{padding:12px 16px;border-bottom:1px solid var(--br);cursor:pointer;font-size:13px}
.sr-item:hover{background:var(--bg3)}
.sr-cat{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tx4);padding:8px 16px 4px;background:var(--bg3)}

/* MOBILE RESPONSIVE */
@media(max-width:768px){
  .hamburger{display:block}
  .navlinks{display:none}
  #app{padding:14px}
  .pt{font-size:26px}
  .grid.g4{grid-template-columns:1fr 1fr}
  .grid.g3{grid-template-columns:1fr 1fr}
  .grid.g2{grid-template-columns:1fr}
  .fg.g4{grid-template-columns:1fr 1fr}
  .fg.g3{grid-template-columns:1fr 1fr}
  .fg.g2{grid-template-columns:1fr}
  .ph{flex-direction:column;gap:12px}
  .ph .fx{flex-wrap:wrap}
  .modal{padding:18px;margin-top:0}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hide-mobile{display:none}
  .sv{font-size:24px}
  .card{padding:14px}
  .global-search input{width:160px}
  .global-search input:focus{width:200px}
  .search-results{width:280px;right:0}
  .mft{justify-content:stretch}
  .mft .btn{flex:1;text-align:center}
}
@media(max-width:480px){
  .grid.g4{grid-template-columns:1fr 1fr}
  .grid.g3{grid-template-columns:1fr}
  .fg.g4{grid-template-columns:1fr}
  .fg.g3{grid-template-columns:1fr}
  .btn{padding:12px 16px;font-size:13px}
  .tbl th,.tbl td{padding:10px 8px;font-size:13px}
}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .2s ease}
</style></head><body>
<nav id="nav">
  <div><div class="logo">◈ M&A INVERSIONES</div><div class="sub">Gestión de Inversiones</div></div>
  <div class="fx g8" style="align-items:center">
    <div class="global-search" style="position:relative">
      <span>⌕</span>
      <input id="gsrch" placeholder="Buscar todo..." autocomplete="off"
        oninput="S.globalSrch=this.value;S.showSearch=true;renderSearchDrop()"
        onfocus="S.showSearch=true;renderSearchDrop()"
        onblur="setTimeout(()=>{S.showSearch=false;document.getElementById('sdrop').innerHTML=''},200)">
      <div id="sdrop"></div>
    </div>
    <div class="navlinks" id="navlinks"></div>
    <button class="hamburger" onclick="toggleMobileMenu()">≡</button>
  </div>
</nav>
<div class="mobile-menu" id="mobile-menu"></div>
<div id="app"></div>
<div id="toast"></div>
<div id="ov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;overflow-y:auto;padding:14px;flex-direction:column;align-items:center" onclick="if(event.target===this)cerrar()"></div>
<script>
// ═══ CONFIGURACIÓN DE SEGURIDAD ═══
const SEC = {
  PIN_KEY: 'ma_pin',
  TIMEOUT: 2 * 60 * 1000, // 2 minutos
  lastActivity: Date.now(),
  locked: true,
  timer: null,
};

function getPin(){ return localStorage.getItem(SEC.PIN_KEY)||null; }
function setPin(p){ localStorage.setItem(SEC.PIN_KEY, p); }

// Reiniciar timer de inactividad
function resetTimer(){
  SEC.lastActivity = Date.now();
  if(SEC.timer) clearTimeout(SEC.timer);
  if(getPin()){
    SEC.timer = setTimeout(()=>{
      autoLock();
    }, SEC.TIMEOUT);
  }
}

// Detectar actividad del usuario
['click','touchstart','keydown','scroll','mousemove'].forEach(ev=>{
  document.addEventListener(ev, resetTimer, {passive:true});
});

function autoLock(){
  if(!getPin()) return;
  SEC.locked = true;
  showLockScreen('La sesión expiró por inactividad');
}

// ═══ PANTALLA DE BIENVENIDA + PIN ═══
function showSplash(){
  const pin = getPin();
  const wrap = document.createElement('div');
  wrap.id = 'splash';
  wrap.style.cssText = 'position:fixed;inset:0;background:#09090f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0';

  wrap.innerHTML = `
    <!-- LOGO M&A -->
    <div style="margin-bottom:32px">
      ${LOGO_SVG}
    </div>

    ${pin ? renderPinPad('') : renderNoPinMsg()}
  `;
  document.body.appendChild(wrap);
}

const LOGO_SVG = `
<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#09090f"/>
    </radialGradient>
    <radialGradient id="gold-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0c84a"/>
      <stop offset="50%" stop-color="#d4a847"/>
      <stop offset="100%" stop-color="#7a5c0e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Círculo exterior -->
  <circle cx="110" cy="110" r="106" fill="url(#bg-grad)" stroke="#2a2210" stroke-width="1.5"/>
  <!-- Círculo decorativo interno -->
  <circle cx="110" cy="110" r="95" fill="none" stroke="#d4a847" stroke-width="0.5" opacity="0.4"/>
  <circle cx="110" cy="110" r="88" fill="none" stroke="#d4a847" stroke-width="0.3" opacity="0.2"/>
  <!-- Líneas decorativas diagonales -->
  <line x1="25" y1="110" x2="50" y2="110" stroke="#d4a847" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="110" x2="195" y2="110" stroke="#d4a847" stroke-width="1" opacity="0.5"/>
  <line x1="110" y1="25" x2="110" y2="50" stroke="#d4a847" stroke-width="1" opacity="0.5"/>
  <line x1="110" y1="170" x2="110" y2="195" stroke="#d4a847" stroke-width="1" opacity="0.5"/>
  <!-- Puntos en las esquinas -->
  <circle cx="47" cy="47" r="2" fill="#d4a847" opacity="0.5"/>
  <circle cx="173" cy="47" r="2" fill="#d4a847" opacity="0.5"/>
  <circle cx="47" cy="173" r="2" fill="#d4a847" opacity="0.5"/>
  <circle cx="173" cy="173" r="2" fill="#d4a847" opacity="0.5"/>
  <!-- Texto M&A grande -->
  <text x="110" y="118" font-family="Georgia, serif" font-size="64" font-weight="700"
    fill="url(#gold-grad)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">M&amp;A</text>
  <!-- Línea separadora -->
  <line x1="52" y1="132" x2="168" y2="132" stroke="#d4a847" stroke-width="0.8" opacity="0.6"/>
  <!-- Subtítulo -->
  <text x="110" y="152" font-family="'Courier Prime', monospace" font-size="13" fill="#d4a847"
    text-anchor="middle" letter-spacing="6" opacity="0.9">INVERSIONES</text>
  <!-- Pequeño rombo decorativo abajo -->
  <polygon points="110,168 114,172 110,176 106,172" fill="#d4a847" opacity="0.5"/>
</svg>`;

function renderPinPad(msg){
  return `
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div style="font-size:11px;letter-spacing:4px;color:#555;text-transform:uppercase">Ingresá tu PIN</div>
    <div id="pin-dots" style="display:flex;gap:14px;margin:4px 0">
      ${[0,1,2,3].map(i=>`<div id="dot${i}" style="width:14px;height:14px;border-radius:50%;border:1.5px solid #2a2a3e;background:#09090f;transition:.15s"></div>`).join('')}
    </div>
    <div id="pin-msg" style="font-size:11px;color:#ef4444;min-height:16px;letter-spacing:1px">${msg||''}</div>
    <div style="display:grid;grid-template-columns:repeat(3,72px);gap:10px">
      ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`
        <button onclick="pinPress('${k}')"
          style="background:#0d0d16;border:1px solid #1e1e2e;color:${k===''?'transparent':'#e8e0d0'};
          font-family:'Courier Prime',monospace;font-size:22px;padding:18px;cursor:pointer;
          transition:.15s;border-radius:2px;${k===''?'pointer-events:none':''}"
          onmouseover="if('${k}'!='')this.style.borderColor='#d4a847';this.style.background='#14141e'"
          onmouseout="this.style.borderColor='#1e1e2e';this.style.background='#0d0d16'">
          ${k}
        </button>`).join('')}
    </div>
  </div>`;
}

function renderNoPinMsg(){
  return `
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:8px">
    <div style="font-size:11px;letter-spacing:3px;color:#555;text-transform:uppercase">Sin PIN configurado</div>
    <button onclick="entrarSinPin()"
      style="background:linear-gradient(135deg,#7a5c0e,#d4a847);color:#000;border:none;
      padding:14px 40px;font-family:'Courier Prime',monospace;font-size:13px;
      letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-weight:700;border-radius:2px">
      Entrar →
    </button>
    <div style="font-size:10px;color:#333;letter-spacing:1px">Podés configurar un PIN en Ajustes</div>
  </div>`;
}

function entrarSinPin(){
  document.getElementById('splash')?.remove();
  SEC.locked = false;
  resetTimer();
}

let pinBuffer = '';
function pinPress(k){
  if(k==='') return;
  if(k==='⌫'){
    pinBuffer = pinBuffer.slice(0,-1);
  } else if(pinBuffer.length < 4){
    pinBuffer += k;
  }
  // Actualizar dots
  [0,1,2,3].forEach(i=>{
    const d = document.getElementById('dot'+i);
    if(d){
      d.style.background = i < pinBuffer.length ? '#d4a847' : '#09090f';
      d.style.borderColor = i < pinBuffer.length ? '#d4a847' : '#2a2a3e';
    }
  });
  if(pinBuffer.length === 4){
    const pin = getPin();
    if(!pin){
      // Primera vez configurando PIN desde splash (no debería pasar)
      entrarSinPin();
    } else if(pinBuffer === pin){
      document.getElementById('splash')?.remove();
      SEC.locked = false;
      pinBuffer = '';
      resetTimer();
      addLog('acceso', 'PIN correcto — acceso concedido');
    } else {
      // PIN incorrecto
      const msg = document.getElementById('pin-msg');
      if(msg) msg.textContent = 'PIN incorrecto, intentá de nuevo';
      // Vibrar dots
      [0,1,2,3].forEach(i=>{
        const d = document.getElementById('dot'+i);
        if(d){ d.style.background = '#ef4444'; d.style.borderColor = '#ef4444'; }
      });
      setTimeout(()=>{
        pinBuffer = '';
        [0,1,2,3].forEach(i=>{
          const d = document.getElementById('dot'+i);
          if(d){ d.style.background = '#09090f'; d.style.borderColor = '#2a2a3e'; }
        });
        if(msg) msg.textContent = '';
      }, 800);
      addLog('acceso', 'PIN incorrecto — intento fallido');
    }
  }
}

// ═══ AUTO-LOCK ═══
function showLockScreen(msg){
  // Quitar splash anterior si hay
  document.getElementById('splash')?.remove();

function calcC(cap,t,p){
  const it=cap*(t/100)*p,tp=cap+it;
  return{it:Math.round(it),tp:Math.round(tp),cuota:Math.round(tp/p)};
}
function genQ(cap,t,p,fi){
  const{cuota}=calcC(cap,t,p);
  const s=new Date(fi);
  return Array.from({length:p},(_,i)=>{
    const d=new Date(s);d.setMonth(d.getMonth()+i+1);
    return{num:i+1,vto:d.toISOString().split('T')[0],monto:cuota,paga:false};
  });
}
function calcCh(m,td,d,ip,ga){
  const int2=Math.round(m*(td/100)*d),imp=Math.round(m*(ip/100)),g=Math.round(ga||0);
  return{interes:int2,impuesto:imp,gastos:g,neto:m-int2-imp-g,ganancia:int2+imp};
}

function rTipoInline(tipo){
  const act=S.ops.filter(o=>o.status==='activo'&&o.tipo===tipo);
  const cap=act.reduce((a,o)=>a+o.capital,0);
  const saldo2=act.reduce((a,o)=>a+sal(o),0);
  const cobrado2=act.reduce((a,o)=>a+o.cuotas.filter(c=>c.paga).reduce((s,c)=>s+c.monto,0),0);
  const mora2=act.filter(o=>vcOp(o).length>0);
  const color=tC(tipo);
  const q=S.srch.toLowerCase();
  const fil=act.filter(o=>!q||cN(o.clienteId).toLowerCase().includes(q)||o.desc.toLowerCase().includes(q));
  return`
  <div class="grid g4 mb12">
    <div class="card"><div class="sv" style="color:${color}">${fmt(cap)}</div><div class="sl">Capital colocado</div><div style="font-size:15px;color:var(--tx4);margin-top:2px">${act.length} activas</div></div>
    <div class="card"><div class="sv ta">${fmt(saldo2)}</div><div class="sl">Saldo pendiente</div></div>
    <div class="card"><div class="sv tgr">${fmt(cobrado2)}</div><div class="sl">Total cobrado</div></div>
    <div class="card"><div class="sv tr">${mora2.length}</div><div class="sl">En mora</div><div style="font-size:15px;color:var(--tx4);margin-top:2px">${act.length?Math.round(mora2.length/act.length*100):0}% cartera</div></div>
  </div>
  ${mora2.length?`<div class="al al-r mb12">⚠ ${mora2.length} con mora — ${fmt(mora2.flatMap(o=>vcOp(o)).reduce((a,c)=>a+c.monto,0))} sin cobrar</div>`:''}
  <div class="srch"><span>⌕</span><input placeholder="Buscar cliente o descripción..." value="${S.srch}" oninput="S.srch=this.value;render()"></div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table class="tbl">
      <thead><tr><th>Cliente</th>${tipo==='prendario'?'<th>Vehículo</th>':''}<th>Capital</th><th>Tasa</th><th>Plazo</th><th>G.Admin</th><th>Neto</th><th>Caja</th><th>Cuotas</th><th>Próx. vto.</th><th>Saldo</th><th>Estado</th></tr></thead>
      <tbody>
        ${!fil.length?`<tr><td colspan="${tipo==='prendario'?12:11}" style="text-align:center;padding:32px;color:var(--tx4)">Sin operaciones — <button class="btn bxs bg" onclick="abrirModalTipo('${tipo}')">+ Crear primera</button></td></tr>`:''}
        ${fil.map(op=>{
          const pg=op.cuotas.filter(c=>c.paga).length,sl=sal(op),vc2=vcOp(op);
          const {cuota}=calcC(op.capital,op.tasa,op.plazo);
          const proxVto=op.cuotas.find(c=>!c.paga);
          const diasProx=proxVto?dds(proxVto.vto,hoy()):null;
          return`<tr class="ck" onclick="abrirOp(${op.id})">
            <td><div style="font-size:14px">${cN(op.clienteId)}</div><div style="font-size:14px;color:var(--tx4)">${op.desc}</div></td>
            ${tipo==='prendario'?`<td>${op.vehiculo?`<div style="font-size:15px;color:var(--pu)">${op.vehiculo.marca} ${op.vehiculo.modelo}</div><div style="font-size:14px;color:var(--tx4)">${op.vehiculo.patente} · ${op.vehiculo.anio}</div>`:'<span style="color:var(--tx4)">—</span>'}</td>`:''}
            <td style="color:var(--go)">${fmt(op.capital)}</td>
            <td>${op.tasa}%</td>
            <td>${op.plazo}m</td>
            <td style="color:var(--am)">${op.gastosAdmin?fmt(op.gastosAdmin):'—'}</td>
            <td style="color:var(--tx2)">${fmt(op.neto)}</td>
            <td style="font-size:14px;color:var(--tx3)">${cajN(op.cajaId)}</td>
            <td style="font-size:14px">${pg}/${op.plazo} · ${fmt(cuota)}/m</td>
            <td style="font-size:14px;color:${diasProx!==null&&diasProx<=0?'var(--rd)':diasProx!==null&&diasProx<=15?'var(--am)':'var(--tx2)'}">${proxVto?fD(proxVto.vto)+(diasProx!==null&&diasProx<=0?' ⚠':''):'✓ Saldado'}</td>
            <td style="color:var(--am)">${fmt(sl)}</td>
            <td>${vc2.length?`<span class="bdg chip-v">⚠ ${vc2.length}</span>`:`<span class="bdg chip-ok">Al día</span>`}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

}

  if(!from||!to||!monto)return toast('Completá todos los campos','err');

  const f2=S.cajas.find(c=>c.id===from);if(f2.balance<monto)return toast('Saldo insuficiente','err');
  S.cajas=S.cajas.map(c=>c.id===from?{...c,balance:c.balance-monto}:c.id===to?{...c,balance:c.balance+monto}:c);
  const fecha=hoy();

  S.movs.push({id:uid(),cajaId:to,tipo:'ingreso',monto,concepto:`${conc} ← ${cajN(from)}`,fecha});

function chTab(btn,tab){btn.closest('.modal').querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));btn.classList.add('on');['ch-d','ch-t','ch-dst','ch-f'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display=id===tab?'block':'none';});}
function cargaFoto(input,zoneId,hiddenId){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const z=document.getElementById(zoneId),h=document.getElementById(hiddenId);if(z)z.innerHTML=`<img src="${e.target.result}" style="max-width:100%;max-height:150px;object-fit:contain">`;if(h)h.value=e.target.result;};r.readAsDataURL(file);}
function prevCh(){
  const m=parseFloat(document.getElementById('fch-m')?.value||0),t=parseFloat(document.getElementById('fch-t')?.value||0),i=parseFloat(document.getElementById('fch-i')?.value||0),ga=parseFloat(document.getElementById('fch-ga')?.value||0);
  const d1=document.getElementById('fch-d')?.value,d2=document.getElementById('fch-v')?.value,dd=d1&&d2?dds(d2,d1):0;
  const de=document.getElementById('fch-ds');if(de&&dd)de.value=dd;
  const el=document.getElementById('fch-prev');if(!el||!m||!t||!dd){if(el)el.style.display='none';return;}
  const r=calcCh(m,t,dd,i,ga);el.style.display='block';
  el.innerHTML=`<div class="pvr"><span class="lk">Valor nominal</span><span class="tg">${fmt(m)}</span></div><div class="pvr"><span class="lk">Interés (${t}%×${dd}d)</span><span class="tr">-${fmt(r.interes)}</span></div><div class="pvr"><span class="lk">Impuesto (${i}%)</span><span class="ta">-${fmt(r.impuesto)}</span></div>${ga?`<div class="pvr"><span class="lk">Gastos admin</span><span style="color:var(--tx3)">-${fmt(r.gastos)}</span></div>`:''}<div class="pvr"><span class="lk">Neto a entregar</span><span class="tgr" style="font-size:16px">${fmt(r.neto)}</span></div><div class="pvr"><span class="lk">Ganancia</span><span class="tg">${fmt(r.ganancia)}</span></div>`;
}
function guardarCheque(){
  const clienteId=parseInt(document.getElementById('fch-cli')?.value),numero=document.getElementById('fch-num')?.value.trim(),banco=document.getElementById('fch-ban')?.value.trim();
  const monto=parseFloat(document.getElementById('fch-m')?.value||0),tasaDiaria=parseFloat(document.getElementById('fch-t')?.value||0),impPct=parseFloat(document.getElementById('fch-i')?.value||0),gastosAdmin=parseFloat(document.getElementById('fch-ga')?.value||0);
  const vencimiento=document.getElementById('fch-v')?.value,ingreso=document.getElementById('fch-d')?.value||hoy();
  const cajaOrigenId=parseInt(document.getElementById('fch-or')?.value)||null,cajaTenenciaId=parseInt(document.getElementById('fch-ten')?.value)||null;
  const dd=vencimiento&&ingreso?dds(vencimiento,ingreso):0;
  if(!clienteId||!numero||!banco||!monto||!vencimiento||!dd)return toast('Completá los campos requeridos','err');
  const r=calcCh(monto,tasaDiaria,dd,impPct,gastosAdmin);
  if(cajaOrigenId){const cj=S.cajas.find(c=>c.id===cajaOrigenId);if(cj&&cj.balance<r.neto)return toast(`Saldo insuficiente en ${cj.name}`,'err');S.cajas=S.cajas.map(c=>c.id===cajaOrigenId?{...c,balance:c.balance-r.neto}:c);S.movs.push({id:uid(),cajaId:cajaOrigenId,tipo:'egreso',monto:r.neto,concepto:`Cheque ${numero} — ${cN(clienteId)}`,fecha:ingreso});}
  S.cheques.push({id:uid(),clienteId,numero,banco,monto,tasaDiaria,dias:dd,vencimiento,impPct,gastosAdmin,...r,estado:'en_cartera',cajaOrigenId,cajaTenenciaId,ingreso,
    titularCuenta:document.getElementById('fch-tit')?.value||'',titularDni:document.getElementById('fch-tdn')?.value||'',titularTel:document.getElementById('fch-tte')?.value||'',cbu:document.getElementById('fch-cbu')?.value||'',endoso:document.getElementById('fch-end')?.value||'',notas:document.getElementById('fch-not')?.value||'',fotoF:document.getElementById('dat-ff')?.value||null,fotoD:document.getElementById('dat-fd')?.value||null,
    destino:{entregadoA:document.getElementById('fch-da')?.value||'',fecha:document.getElementById('fch-df')?.value||'',motivo:document.getElementById('fch-dm')?.value||'',tipo:document.getElementById('fch-dt')?.value||'',comision:parseFloat(document.getElementById('fch-dc')?.value||0),notas:document.getElementById('fch-dn')?.value||''},
  });
  cerrar();toast('Cheque registrado');render();
}
function cobrarCh(id){const ch=S.cheques.find(c=>c.id===id);if(!ch)return;if(ch.cajaOrigenId){S.cajas=S.cajas.map(c=>c.id===ch.cajaOrigenId?{...c,balance:c.balance+ch.monto}:c);S.movs.push({id:uid(),cajaId:ch.cajaOrigenId,tipo:'ingreso',monto:ch.monto,concepto:`Cobro cheque ${ch.numero}`,fecha:hoy()});}S.cheques=S.cheques.map(c=>c.id===id?{...c,estado:'cobrado'}:c);toast('Cheque cobrado · '+fmt(ch.monto)+' acreditado');render();}

function toggleCuota(opId,num){

const LOG_KEY='fin_log';
function getLogs(){try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch{return[];}}
function addLog(tipo,detalle){
  const logs=getLogs();
  logs.unshift({fecha:new Date().toLocaleString('es-AR'),tipo,detalle});
  if(logs.length>200)logs.pop();
  localStorage.setItem(LOG_KEY,JSON.stringify(logs));
}
function logAcceso(txt){addLog('acceso',txt);}
function logOp(txt){addLog('operacion',txt);}

// ═══ PANTALLA DE REPORTES ═══
function rReportes(){
  const act=S.ops.filter(o=>o.status==='activo');
  const totalCap=act.reduce((a,o)=>a+o.capital,0);
  const totalSaldo=act.reduce((a,o)=>a+sal(o),0);
  const totalCobrado=act.reduce((a,o)=>a+o.cuotas.filter(c=>c.paga).reduce((s,c)=>s+c.monto,0),0);

  // morosidad
  const conMora=act.filter(o=>vcOp(o).length>0);
  const pctMora=act.length?Math.round(conMora.length/act.length*100):0;

  // ganancia por tipo
  const ganPorTipo=['prestamo','hipotecario','prendario'].map(t=>{
    const ops=act.filter(o=>o.tipo===t);
    const gan=ops.reduce((a,o)=>{const{it}=calcC(o.capital,o.tasa,o.plazo);return a+it;},0);
    return{tipo:tL(t),color:tC(t),gan,ops:ops.length};
  });

  // cheques
  const chCob=S.cheques.filter(c=>c.estado==='cobrado');
  const ganCh=S.cheques.reduce((a,c)=>a+c.ganancia,0);

  // flujo proyectado próximos 6 meses
  const flujo=[];
  for(let i=0;i<6;i++){
    const d=new Date(); d.setMonth(d.getMonth()+i);
    const mes=d.toLocaleDateString('es-AR',{month:'short',year:'numeric'});
    const y=d.getFullYear(), m=d.getMonth();
    const cuotas=act.flatMap(o=>o.cuotas.filter(c=>{const cd=new Date(c.vto+'T00:00:00');return!c.paga&&cd.getFullYear()===y&&cd.getMonth()===m;}));
    const cheques=S.cheques.filter(c=>{const cv=new Date(c.vencimiento+'T00:00:00');return c.estado==='en_cartera'&&cv.getFullYear()===y&&cv.getMonth()===m;});
    flujo.push({mes,cuotas:cuotas.reduce((a,c)=>a+c.monto,0),cheques:cheques.reduce((a,c)=>a+c.monto,0)});
  }
  const maxFlujo=Math.max(...flujo.map(f=>f.cuotas+f.cheques),1);

  // rentabilidad por mes (cobrado)
  const rentMes=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const y=d.getFullYear(), m=d.getMonth();
    const mes=d.toLocaleDateString('es-AR',{month:'short'});
    const cobrado=S.movs.filter(mv=>{const fd=new Date(mv.fecha+'T00:00:00');return mv.tipo==='ingreso'&&fd.getFullYear()===y&&fd.getMonth()===m&&mv.concepto.toLowerCase().includes('cuota');}).reduce((a,mv)=>a+mv.monto,0);
    rentMes.push({mes,cobrado});
  }
  const maxRent=Math.max(...rentMes.map(r=>r.cobrado),1);

  // log
  const logs=getLogs();

  return`
  <div class="ph"><div><div class="pt">Reportes</div><div class="ps">Visión del negocio</div></div></div>

  <div class="grid g4 mb16">
    <div class="card"><div class="sv">${fmt(totalCap)}</div><div class="sl">Capital en riesgo</div></div>
    <div class="card"><div class="sv tgr">${fmt(totalCobrado)}</div><div class="sl">Total cobrado</div></div>
    <div class="card"><div class="sv ta">${pctMora}%</div><div class="sl">Tasa de morosidad</div><div style="font-size:15px;color:var(--tx4);margin-top:2px">${conMora.length} de ${act.length} ops</div></div>
    <div class="card"><div class="sv tgr">${fmt(ganCh)}</div><div class="sl">Ganancia cheques</div><div style="font-size:15px;color:var(--tx4);margin-top:2px">${chCob.length} cobrados</div></div>
  </div>

  <div class="grid g2 mb16">
    <div class="card">
      <div class="stl">Rentabilidad últimos 6 meses (ingresos de cuotas)</div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:8px">
        ${rentMes.map(r=>{
          const h=maxRent>0?Math.round((r.cobrado/maxRent)*90):0;
          return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
            <div style="font-size:14px;color:var(--go)">${r.cobrado?fmt(r.cobrado).replace('$','').replace('.000','k'):''}</div>
            <div style="width:100%;height:${h}px;background:linear-gradient(180deg,var(--go2),var(--go));min-height:2px"></div>
            <div style="font-size:14px;color:var(--tx4)">${r.mes}</div>
          </div>`;}).join('')}
      </div>
    </div>
    <div class="card">
      <div class="stl">Ganancia proyectada por tipo de crédito</div>
      ${ganPorTipo.map(g=>`
      <div style="margin-bottom:12px">
        <div class="fb mb8">
          <span style="font-size:14px;color:var(--tx3)">${g.tipo} (${g.ops} ops)</span>
          <span style="font-size:14px;color:${g.color}">${fmt(g.gan)}</span>
        </div>
        <div class="pb"><div class="pf" style="width:${totalCap>0?Math.round(g.gan/(totalCap*0.5)*100):0}%;background:${g.color}"></div></div>
      </div>`).join('')}
    </div>
  </div>

  <div class="card mb16">
    <div class="stl">Flujo de caja proyectado — próximos 6 meses</div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px">
      ${flujo.map(f=>{
        const tot=f.cuotas+f.cheques;
        const hc=maxFlujo>0?Math.round((f.cuotas/maxFlujo)*100):0;
        const hch=maxFlujo>0?Math.round((f.cheques/maxFlujo)*100):0;
        return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
          <div style="font-size:14px;color:var(--tx4)">${tot?fmt(tot).replace('$','').replace('.000','k'):''}</div>
          <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:90px;gap:1px">
            <div style="width:100%;height:${hch}px;background:var(--am);min-height:${f.cheques?2:0}px"></div>
            <div style="width:100%;height:${hc}px;background:var(--bl);min-height:${f.cuotas?2:0}px"></div>
          </div>
          <div style="font-size:14px;color:var(--tx4);text-align:center">${f.mes}</div>
        </div>`;}).join('')}
    </div>

let DB_READY = false;

async function loadFromDB(){
  showLoader('Conectando con M&A Inversiones...');
  try {
    const [clientes, cajas, movs, ops, cuotas, cheques, cfg] = await Promise.all([
      sbGet('clientes', 'order=id'),
      sbGet('cajas', 'order=id'),
      sbGet('movimientos', 'order=id'),
      sbGet('operaciones', 'order=id'),
      sbGet('cuotas', 'order=operacion_id,numero'),
      sbGet('cheques', 'order=id'),
      sbGet('configuracion'),
    ]);

    // Mapear clientes
    S.clientes = clientes.map(c => ({
      id: c.id, name: c.name, dni: c.dni||'', phone: c.phone||'',
      email: c.email||'', address: c.address||'', score: c.score||'bueno'
    }));

    // Mapear cajas
    S.cajas = cajas.map(c => ({
      id: c.id, name: c.name, type: c.type, balance: parseFloat(c.balance)||0,
      color: c.color, icon: c.icon, currency: c.currency
    }));

    // Mapear movimientos
    S.movs = movs.map(m => ({
      id: m.id, cajaId: m.caja_id, tipo: m.tipo,
      monto: parseFloat(m.monto), concepto: m.concepto||'', fecha: m.fecha
    }));

    // Mapear operaciones con cuotas
    S.ops = ops.map(op => {
      const opCuotas = cuotas
        .filter(c => c.operacion_id === op.id)
        .map(c => ({num: c.numero, vto: c.vto, monto: parseFloat(c.monto), paga: c.paga, dbId: c.id}));
      return {
        id: op.id, clienteId: op.cliente_id, tipo: op.tipo,
        capital: parseFloat(op.capital), tasa: parseFloat(op.tasa),
        plazo: op.plazo, fi: op.fecha_inicio, cajaId: op.caja_id,
        gastosAdmin: parseFloat(op.gastos_admin)||0, neto: parseFloat(op.neto)||0,
        desc: op.descripcion||'', status: op.status,
        vehiculo: op.vehiculo||null, cuotas: opCuotas
      };
    });

    // Mapear cheques
    S.cheques = cheques.map(c => ({
      id: c.id, clienteId: c.cliente_id, numero: c.numero||'',
      banco: c.banco||'', monto: parseFloat(c.monto),
      tasaDiaria: parseFloat(c.tasa_diaria)||0.3, dias: c.dias||0,
      vencimiento: c.vencimiento, impPct: parseFloat(c.imp_pct)||1.2,
      gastosAdmin: parseFloat(c.gastos_admin)||0,
      interes: parseFloat(c.interes)||0, impuesto: parseFloat(c.impuesto)||0,
      gastos: parseFloat(c.gastos)||0, neto: parseFloat(c.neto)||0,
      ganancia: parseFloat(c.ganancia)||0, estado: c.estado||'en_cartera',
      cajaOrigenId: c.caja_origen_id, cajaTenenciaId: c.caja_tenencia_id,
      ingreso: c.ingreso, titularCuenta: c.titular_cuenta||'',
      titularDni: c.titular_dni||'', titularTel: c.titular_tel||'',
      cbu: c.cbu||'', endoso: c.endoso||'', notas: c.notas||'',
      fotoF: c.foto_frente||null, fotoD: c.foto_dorso||null,
      destino: c.destino||{}
    }));

    // Config
    cfg.forEach(c => {
      if(c.clave === 'tasas') S.cfg.tasas = c.valor;
      if(c.clave === 'impCheque') S.cfg.impCh = parseFloat(c.valor);
      if(c.clave === 'logo') S.cfg.logo = c.valor;
    });

    DB_READY = true;
    saveLocalBackup();
    hideLoader();
    buildNav(); render(); addLog('acceso','App abierta');
    startAutoBackup();
  } catch(e) {
    console.error('Error cargando DB:', e);
    // Intentar cargar desde backup local
    const local = localStorage.getItem('ma_backup');
    if(local){
      try {
        const data = JSON.parse(local);
        if(data.clientes) S.clientes = data.clientes;
        if(data.cajas) S.cajas = data.cajas;
        if(data.movs) S.movs = data.movs;
        if(data.ops) S.ops = data.ops;
        if(data.cheques) S.cheques = data.cheques;
        hideLoader();
        showBanner('⚠ Sin conexión — mostrando datos del backup local. Los cambios NO se guardarán hasta recuperar conexión.','amber');
        buildNav(); render(); checkPin();
      } catch(e2){
        hideLoader();
        showBanner('✕ Error de conexión y sin backup local disponible.','red');
        buildNav(); render();
      }
    } else {
      hideLoader();
      showBanner('⚠ Sin conexión a la base de datos. Revisá tu conexión a internet.','amber');
      buildNav(); render();
    }
  }
}

// ═══ BACKUP ═══
function saveLocalBackup(){
  const data = {
    clientes: S.clientes, cajas: S.cajas, movs: S.movs,
    ops: S.ops, cheques: S.cheques, ts: new Date().toISOString()
  };
  localStorage.setItem('ma_backup', JSON.stringify(data));
}

async function saveRemoteBackup(){
  try {
    const data = {
      clientes: S.clientes, cajas: S.cajas, movs: S.movs,
      ops: S.ops, cheques: S.cheques, ts: new Date().toISOString()
    };
    // Mantener solo los últimos 24 backups (24 horas)
    const existing = await sbGet('backups', 'order=created_at.desc&limit=1');
    await sbPost('backups', {datos: data});
    // Limpiar backups viejos (más de 48h)
    const cutoff = new Date(); cutoff.setHours(cutoff.getHours()-48);
    await fetch(`${SB_URL}/rest/v1/backups?created_at=lt.${cutoff.toISOString()}`, {
      method:'DELETE', headers: SB_HEADERS
    });
    saveLocalBackup();
    addLog('acceso', 'Backup automático guardado');
    console.log('Backup guardado:', new Date().toLocaleString('es-AR'));
  } catch(e){
    console.error('Error en backup:', e);
    saveLocalBackup(); // Al menos guardar local
  }
}

function startAutoBackup(){
  // Backup cada 1 hora
  setInterval(saveRemoteBackup, 60 * 60 * 1000);
  // Backup al cerrar/salir
  window.addEventListener('beforeunload', ()=>{ saveLocalBackup(); });
  console.log('Auto-backup activo: cada 1 hora');
}

// Override guardarOp
const _guardarOpOrig = guardarOp;
guardarOp = async function(){
  const clienteId=parseInt(document.getElementById('fo-cli')?.value),tipo=document.getElementById('fo-tipo')?.value;
  const capital=parseFloat(document.getElementById('fo-c')?.value||0),tasa=parseFloat(document.getElementById('fo-r')?.value||0);
  const plazo=parseInt(document.getElementById('fo-p')?.value||1),gastosAdmin=parseFloat(document.getElementById('fo-g')?.value||0);
  const cajaId=parseInt(document.getElementById('fo-caja')?.value),fi=document.getElementById('fo-fi')?.value||hoy();
  const desc=document.getElementById('fo-desc')?.value||'';
  if(!clienteId||!capital||!tasa||!cajaId)return toast('Completá los campos requeridos','err');
  const caja=S.cajas.find(c=>c.id===cajaId);
  if(!caja)return toast('Caja no encontrada','err');
  if(caja.balance<capital)return toast(`Saldo insuficiente en ${caja.name}`,'err');
  let vehiculo=null;
  if(tipo==='prendario'){vehiculo={marca:document.getElementById('v-mar')?.value||'',modelo:document.getElementById('v-mod')?.value||'',anio:document.getElementById('v-ani')?.value||'',patente:document.getElementById('v-pat')?.value||'',color:document.getElementById('v-col')?.value||'',motor:document.getElementById('v-mot')?.value||'',chasis:document.getElementById('v-cha')?.value||'',km:document.getElementById('v-km')?.value||'',seguro:document.getElementById('v-seg')?.value||'',poliza:document.getElementById('v-pol')?.value||'',vtoSeg:document.getElementById('v-vts')?.value||''};}
  const cuotas=genQ(capital,tasa,plazo,fi);
  const newOp={clienteId,tipo,capital,tasa,plazo,fi,cajaId,gastosAdmin,desc,status:'activo',neto:capital-gastosAdmin,cuotas,vehiculo};
  try {
    showLoader('Guardando operación...');
    const dbOp = await dbSaveOp(newOp);
    // Asignar IDs de DB a cuotas
    newOp.id = dbOp.id;
    newOp.cuotas = cuotas.map((c,i) => ({...c, dbId: dbOp.cuotas?.[i]?.id}));
    S.ops.push(newOp);
    // Actualizar caja
    const newBal = caja.balance - capital;
    S.cajas = S.cajas.map(c=>c.id===cajaId?{...c,balance:newBal}:c);
    await dbUpdateCajaBalance(cajaId, newBal);
    const mov = {cajaId, tipo:'egreso', monto:capital, concepto:`${tL(tipo)} — ${cN(clienteId)}`, fecha:fi};
    const dbMov = await dbSaveMov(mov);
    S.movs.push({...mov, id:dbMov.id});
    saveLocalBackup();
    hideLoader(); cerrar(); toast(`${fmt(capital)} descontado de ${caja.name}`); render();
    addLog('operacion',`Nueva op: ${tL(tipo)} ${cN(clienteId)} ${fmt(capital)}`);
  } catch(e){ hideLoader(); toast('Error guardando: '+e.message,'err'); console.error(e); }
};

  const from=parseInt(document.getElementById('ft-o')?.value),to=parseInt(document.getElementById('ft-d')?.value);
  const monto=parseFloat(document.getElementById('ft-m')?.value||0),conc=document.getElementById('ft-c')?.value||'Transferencia';
  if(!from||!to||!monto)return toast('Completá todos los campos','err');

  const f2=S.cajas.find(c=>c.id===from);if(f2.balance<monto)return toast('Saldo insuficiente','err');
  try {
    const newBalFrom = f2.balance - monto;
    const newBalTo = S.cajas.find(c=>c.id===to)?.balance + monto;
    S.cajas=S.cajas.map(c=>c.id===from?{...c,balance:newBalFrom}:c.id===to?{...c,balance:newBalTo}:c);
    await Promise.all([dbUpdateCajaBalance(from, newBalFrom), dbUpdateCajaBalance(to, newBalTo)]);
    const fecha=hoy();
    const m1={cajaId:from,tipo:'egreso',monto,concepto:`${conc} → ${cajN(to)}`,fecha};
    const m2={cajaId:to,tipo:'ingreso',monto,concepto:`${conc} ← ${cajN(from)}`,fecha};
    const [d1,d2] = await Promise.all([dbSaveMov(m1), dbSaveMov(m2)]);
    S.movs.push({...m1,id:d1.id},{...m2,id:d2.id});
    saveLocalBackup(); cerrar(); toast(`${fmt(monto)} transferidos`); render();
  } catch(e){ toast('Error: '+e.message,'err'); }
};

  } catch(e){ toast('Error: '+e.message,'err'); console.error(e); }
};

const _toggleCuotaOrig = toggleCuota;
toggleCuota = async function(opId, num){
  const op=S.ops.find(o=>o.id===opId);if(!op)return;
  const c=op.cuotas.find(c=>c.num===num);if(!c)return;
  const era=c.paga; c.paga=!era;
  try {
    if(c.dbId) await dbUpdateCuota(c);
    if(!era&&op.cajaId){
      const newBal = S.cajas.find(ca=>ca.id===op.cajaId)?.balance + c.monto;
      S.cajas=S.cajas.map(ca=>ca.id===op.cajaId?{...ca,balance:newBal}:ca);
      await dbUpdateCajaBalance(op.cajaId, newBal);
      const mov={cajaId:op.cajaId,tipo:'ingreso',monto:c.monto,concepto:`Cuota ${num} — ${cN(op.clienteId)}`,fecha:hoy()};
      const dbM=await dbSaveMov(mov); S.movs.push({...mov,id:dbM.id});
      toast(`Cuota ${num} cobrada · ${fmt(c.monto)} → ${cajN(op.cajaId)}`);
    } else if(era&&op.cajaId){
      const newBal = S.cajas.find(ca=>ca.id===op.cajaId)?.balance - c.monto;
      S.cajas=S.cajas.map(ca=>ca.id===op.cajaId?{...ca,balance:newBal}:ca);
      await dbUpdateCajaBalance(op.cajaId, newBal);
      const mov={cajaId:op.cajaId,tipo:'egreso',monto:c.monto,concepto:`Reversión cuota ${num} — ${cN(op.clienteId)}`,fecha:hoy()};
      const dbM=await dbSaveMov(mov); S.movs.push({...mov,id:dbM.id});
      toast('Cuota desmarcada');
    }
    saveLocalBackup(); abrirOp(opId);
  } catch(e){ toast('Error: '+e.message,'err'); c.paga=era; }
};

// ═══ BÚSQUEDA GLOBAL ═══
function globalSearch(q){
  if(!q||q.length<2) return [];
  const ql=q.toLowerCase();
  const results=[];

  // Clientes
  S.clientes.filter(c=>c.name.toLowerCase().includes(ql)||c.dni.includes(ql)||c.phone.includes(ql)).forEach(c=>{
    results.push({tipo:'cliente',icon:'👤',label:c.name,sub:`DNI ${c.dni}`,action:`abrirCliente(${c.id})`});
  });

  // Operaciones
  S.ops.filter(o=>cN(o.clienteId).toLowerCase().includes(ql)||o.desc.toLowerCase().includes(ql)||tL(o.tipo).toLowerCase().includes(ql)).forEach(o=>{
    results.push({tipo:'operacion',icon:'💰',label:`${cN(o.clienteId)} — ${tL(o.tipo)}`,sub:`${fmt(o.capital)} · ${o.tasa}% mens.`,action:`abrirOp(${o.id})`});
  });

  // Cheques
  S.cheques.filter(c=>c.numero.includes(ql)||c.banco.toLowerCase().includes(ql)||cN(c.clienteId).toLowerCase().includes(ql)).forEach(c=>{
    results.push({tipo:'cheque',icon:'📋',label:`Cheque ${c.numero} — ${c.banco}`,sub:`${cN(c.clienteId)} · ${fmt(c.monto)}`,action:`abrirCheque(${c.id})`});
  });

  // Cajas
  S.cajas.filter(c=>c.name.toLowerCase().includes(ql)).forEach(c=>{
    results.push({tipo:'caja',icon:'🏦',label:c.name,sub:`${fmt(c.balance)} · ${c.currency}`,action:`abrirCaja(${c.id})`});
  });

  return results.slice(0,12);
}

function renderGlobalSearch(){
  const q=S.globalSrch;
  if(!q||q.length<2) return '';
  const results=globalSearch(q);
  if(!results.length) return `<div class="search-results"><div style="padding:16px;color:var(--tx4);font-size:13px;text-align:center">Sin resultados para "${q}"</div></div>`;

  const byTipo={};
  results.forEach(r=>{if(!byTipo[r.tipo])byTipo[r.tipo]=[];byTipo[r.tipo].push(r);});
  const tipoLabel={cliente:'Clientes',operacion:'Operaciones',cheque:'Cheques',caja:'Cajas'};

  return `<div class="search-results">
    ${Object.entries(byTipo).map(([tipo,items])=>`
      <div class="sr-cat">${tipoLabel[tipo]||tipo}</div>
      ${items.map(r=>`<div class="sr-item" onclick="${r.action};S.globalSrch='';S.showSearch=false;document.getElementById('gsrch')?.blur();render()">
        <div style="font-size:14px">${r.icon} ${r.label}</div>
        <div style="font-size:11px;color:var(--tx4);margin-top:2px">${r.sub}</div>
      </div>`).join('')}
    `).join('')}
  </div>`;
}

        <select id="eo-tipo" onchange="document.getElementById('eo-r').value=dR(this.value)">
          <option value="prestamo" ${op.tipo==='prestamo'?'selected':''}>Préstamo Personal</option>
          <option value="hipotecario" ${op.tipo==='hipotecario'?'selected':''}>Hipotecario</option>
          <option value="prendario" ${op.tipo==='prendario'?'selected':''}>Prendario</option>
        </select>
      </div>
    </div>
    <div class="fg g3 mt12">
      <div><label class="lb">Tasa mensual %</label><input id="eo-r" type="number" step="0.1" value="${op.tasa}"></div>
      <div><label class="lb">Caja</label><select id="eo-caja">${co}</select></div>
      <div><label class="lb">Gastos admin $</label><input id="eo-ga" type="number" value="${op.gastosAdmin}"></div>
    </div>
    <div class="mt12"><label class="lb">Descripción</label><input id="eo-desc" value="${op.desc}"></div>
    <div class="al al-a mt12">⚠ Solo se editan datos de referencia. Las cuotas ya generadas no cambian.</div>
    <div class="mft">
      <button class="btn bo" onclick="cerrar()">Cancelar</button>
      <button class="btn bg" onclick="guardarEditarOp(${id})">Guardar cambios</button>
    </div>
  </div>`);
}

async function guardarEditarOp(id){
  const op=S.ops.find(o=>o.id===id);if(!op)return;
  op.clienteId=parseInt(document.getElementById('eo-cli')?.value)||op.clienteId;
  op.tipo=document.getElementById('eo-tipo')?.value||op.tipo;
  op.tasa=parseFloat(document.getElementById('eo-r')?.value)||op.tasa;
  op.cajaId=parseInt(document.getElementById('eo-caja')?.value)||op.cajaId;
  op.gastosAdmin=parseFloat(document.getElementById('eo-ga')?.value)||0;
  op.desc=document.getElementById('eo-desc')?.value||op.desc;
  op.neto=op.capital-op.gastosAdmin;
  try{
    await sbPatch('operaciones',id,{
      cliente_id:op.clienteId,tipo:op.tipo,tasa:op.tasa,
      caja_id:op.cajaId,gastos_admin:op.gastosAdmin,
      neto:op.neto,descripcion:op.desc
    });
    saveLocalBackup();
    cerrar();toast('Operación actualizada');render();
  }catch(e){toast('Error: '+e.message,'err');}
}

// ═══ EDITAR CLIENTE ═══
function abrirEditarCliente(id){
  const cl=S.clientes.find(c=>c.id===id);if(!cl)return;
  showOv(`<div class="modal">
    <div class="mhd"><div class="mtt">Editar Cliente</div><button class="btn bsm bo" onclick="cerrar()">✕</button></div>
    <div class="fg g2">
      <div><label class="lb">Nombre *</label><input id="ec-n" value="${cl.name}"></div>
      <div><label class="lb">DNI *</label><input id="ec-d" value="${cl.dni}"></div>
    </div>
    <div class="fg g2 mt12">
      <div><label class="lb">Teléfono</label><input id="ec-p" value="${cl.phone||''}"></div>
      <div><label class="lb">Email</label><input id="ec-e" value="${cl.email||''}"></div>
    </div>
    <div class="mt12"><label class="lb">Dirección</label><input id="ec-a" value="${cl.address||''}"></div>
    <div class="mt12"><label class="lb">Calificación</label>
      <select id="ec-s">
        <option value="bueno" ${cl.score==='bueno'?'selected':''}>Bueno</option>
        <option value="regular" ${cl.score==='regular'?'selected':''}>Regular</option>
        <option value="moroso" ${cl.score==='moroso'?'selected':''}>Moroso</option>
      </select>
    </div>
    <div class="mft">
      <button class="btn bo" onclick="cerrar()">Cancelar</button>
      <button class="btn bg" onclick="guardarEditarCliente(${id})">Guardar cambios</button>
    </div>
  </div>`);
}

async function guardarEditarCliente(id){
  const name=document.getElementById('ec-n')?.value.trim(),dni=document.getElementById('ec-d')?.value.trim();
  if(!name||!dni)return toast('Nombre y DNI requeridos','err');
  const upd={name,dni,phone:document.getElementById('ec-p')?.value||'',email:document.getElementById('ec-e')?.value||'',address:document.getElementById('ec-a')?.value||'',score:document.getElementById('ec-s')?.value||'bueno'};
  try{
    await sbPatch('clientes',id,upd);
    S.clientes=S.clientes.map(c=>c.id===id?{...c,...upd}:c);
    saveLocalBackup();cerrar();toast('Cliente actualizado');render();
  }catch(e){toast('Error: '+e.message,'err');}
}

// ═══ RESUMEN DEL DÍA ═══
function rResumenDia(){
  const hoyStr=hoy();
  const vcs=S.ops.filter(o=>o.status==='activo').flatMap(o=>o.cuotas.filter(c=>!c.paga&&new Date(c.vto)<=new Date()));
  const chHoy=S.cheques.filter(c=>c.estado==='en_cartera'&&c.vencimiento===hoyStr);
  const cobradoHoy=S.movs.filter(m=>m.fecha===hoyStr&&m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gastadoHoy=S.movs.filter(m=>m.fecha===hoyStr&&m.tipo==='egreso').reduce((a,m)=>a+m.monto,0);

  if(!vcs.length&&!chHoy.length&&!cobradoHoy&&!gastadoHoy) return '';

  return `<div class="card mb16" style="border-left:3px solid var(--go)">
    <div class="stl">Resumen de hoy — ${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div>
    <div class="grid g4">
      <div><div class="sv tgr">${fmt(cobradoHoy)}</div><div class="sl">Cobrado hoy</div></div>
      <div><div class="sv tr">${fmt(gastadoHoy)}</div><div class="sl">Entregado hoy</div></div>
      <div><div class="sv ${vcs.length?'tr':'tgr'}">${vcs.length}</div><div class="sl">Cuotas vencidas</div></div>
      <div><div class="sv ${chHoy.length?'ta':'tgr'}">${chHoy.length}</div><div class="sl">Cheques vencen hoy</div></div>
    </div>
  </div>`;
}
function renderSearchDrop(){
  const el=document.getElementById('sdrop');
  if(!el)return;
  el.innerHTML=S.showSearch&&S.globalSrch.length>=2?renderGlobalSearch():'';
}
